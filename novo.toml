[package]
name        = "novim"
version     = "0.1.1"
description = "novim — modal terminal editor written in Novo.  v1: a [Str] line-vector buffer, Vim motions/operators, an ANSI TUI, a deterministic --batch test mode, and TOML-driven keymaps + colorschemes.  See features/orbits/novim/README.md for the v1 scope + slice plan (piece-tree / novols LSP / novo-treesitter / plugins are v2)."
main        = "src/main.nv"

[dependencies]
# No external Novo packages.

# Tree-sitter syntax highlighting (src/ts.nv).  Links the system libtree-sitter
# plus the orbit/novo-treesitter shim, both installed to ~/.novo/lib by
# orbit/novo-treesitter/bin/install-lib.sh.  The rpath is the absolute lib dir
# so both the dev binary (orbit/novim/novim) and the installed ~/.novo/bin/novim
# resolve the shim identically.  If the grammar .so isn't found at RUNTIME,
# ts.ts_spans returns [] and the renderer falls back to the native tokenizer —
# so highlighting degrades gracefully, but the shim .so must exist at link time
# (run install-lib.sh first).
#
# The absolute /home path is machine-specific; novim is a local dogfood orbit.
# A portable install would resolve $HOME at configure time.
[ffi.tree_sitter]
pkg_config = "tree-sitter"

[ffi.novo_treesitter_shim]
linker = "-L/home/klajen/.novo/lib -lnovo_treesitter_shim -Wl,-rpath,/home/klajen/.novo/lib -ldl"
